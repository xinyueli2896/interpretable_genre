[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretable-genre"
version = "0.1.0"
description = "Theory-constrained, measure-localized genre classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "mido",
  "joblib",
  "torch",
  "tqdm",
  "matplotlib",
  "imageio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
